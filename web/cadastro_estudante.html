<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InterVan - Cadastro de Estudante</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-brand">
        <a href="index.html" class="brand-link" aria-label="InterVan - Ir para a página inicial">
          InterVan
        </a>
        <svg class="van-icon" viewBox="0 0 64 28" fill="none" aria-hidden="true">
          <path d="M4 11H12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
          <path d="M2 16H11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.45"/>
          <path d="M6 21H12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
          <path d="M16 7H41L49 13H56C58.2 13 60 14.8 60 17V21H54M38 21H26M20 21H16V7Z"
                stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
          <path d="M41 7V13H49" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="23" cy="21.5" r="4.2" fill="var(--bg)" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="50" cy="21.5" r="4.2" fill="var(--bg)" stroke="currentColor" stroke-width="2.5"/>
        </svg>
      </div>

      <div class="theme-switch-wrapper">
        <span class="theme-label" id="theme-status">Escuro</span>
        <label class="theme-switch" for="theme-toggle" aria-label="Alternar entre modo claro e escuro">
          <input type="checkbox" id="theme-toggle" checked />
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main class="driver-stage">
      <div class="driver-header">
        <span class="avatar-ring avatar-student driver-avatar" aria-hidden="true">
          <svg viewBox="0 0 120 120" fill="none">
            <circle cx="60" cy="60" r="60" fill="currentColor" />
            <circle cx="60" cy="44" r="16" fill="var(--avatar-figure)" />
            <polygon points="60,15 31,27 60,37 89,27" fill="var(--avatar-figure)" />
            <line x1="82" y1="30" x2="82" y2="43" stroke="var(--avatar-accent)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="82" cy="45" r="2.6" fill="var(--avatar-accent)" />
            <path d="M24 106C26 83 41 71 60 71C79 71 94 83 96 106" fill="var(--avatar-figure)" />
            <path d="M47 74L60 88L73 74" stroke="var(--avatar-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="pill-label student-pill">CADASTRO <strong>ESTUDANTE</strong></span>
        <p class="driver-hint">Crie sua conta para encontrar vans e horários na sua cidade</p>
      </div>

      <form id="student-form" class="driver-form" novalidate>
        <div class="form-grid">
          <div class="field field-full">
            <label for="nome">Nome completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex.: Mariana Oliveira Souza"
              required
            />
          </div>

          <div class="field">
            <label for="estado">Estado (UF)</label>
            <select id="estado" name="estado" required>
              <option value="" selected disabled>Selecione o estado</option>
              <option value="AC">Acre (AC)</option>
              <option value="AL">Alagoas (AL)</option>
              <option value="AP">Amapá (AP)</option>
              <option value="AM">Amazonas (AM)</option>
              <option value="BA">Bahia (BA)</option>
              <option value="CE">Ceará (CE)</option>
              <option value="DF">Distrito Federal (DF)</option>
              <option value="ES">Espírito Santo (ES)</option>
              <option value="GO">Goiás (GO)</option>
              <option value="MA">Maranhão (MA)</option>
              <option value="MT">Mato Grosso (MT)</option>
              <option value="MS">Mato Grosso do Sul (MS)</option>
              <option value="MG">Minas Gerais (MG)</option>
              <option value="PA">Pará (PA)</option>
              <option value="PB">Paraíba (PB)</option>
              <option value="PR">Paraná (PR)</option>
              <option value="PE">Pernambuco (PE)</option>
              <option value="PI">Piauí (PI)</option>
              <option value="RJ">Rio de Janeiro (RJ)</option>
              <option value="RN">Rio Grande do Norte (RN)</option>
              <option value="RS">Rio Grande do Sul (RS)</option>
              <option value="RO">Rondônia (RO)</option>
              <option value="RR">Roraima (RR)</option>
              <option value="SC">Santa Catarina (SC)</option>
              <option value="SP">São Paulo (SP)</option>
              <option value="SE">Sergipe (SE)</option>
              <option value="TO">Tocantins (TO)</option>
            </select>
          </div>

          <div class="field">
            <label for="cidade">Cidade</label>
            <select id="cidade" name="cidade" disabled required>
              <option value="" selected disabled>Escolha um estado primeiro</option>
            </select>
          </div>

          <div class="field">
            <label for="instituicao">Instituição de ensino</label>
            <input
              type="text"
              id="instituicao"
              name="instituicao"
              placeholder="Ex.: IFSP - Campus Salto"
              required
            />
          </div>

          <div class="field">
            <label for="turno">Turno</label>
            <select id="turno" name="turno" required>
              <option value="" selected disabled>Selecione o turno</option>
              <option value="Manhã">Manhã</option>
              <option value="Tarde">Tarde</option>
              <option value="Noite">Noite</option>
              <option value="Integral">Integral</option>
            </select>
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div class="field">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              minlength="6"
              placeholder="Mínimo de 6 caracteres"
              required
            />
          </div>
        </div>

        <div class="form-actions">
          <a href="index.html" class="btn btn-secondary btn-link">VOLTAR</a>
          <button type="submit" class="btn btn-primary">CRIAR CONTA</button>
        </div>

        <div id="student-status" class="driver-status" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <script>
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('theme-toggle');
    const themeStatus = document.getElementById('theme-status');

    function applyTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      const isDark = theme === 'dark';
      themeToggle.checked = isDark;
      themeStatus.textContent = isDark ? 'Escuro' : 'Claro';
      localStorage.setItem('intervan-theme', theme);
    }

    const savedTheme = localStorage.getItem('intervan-theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle.addEventListener('change', () => {
      applyTheme(themeToggle.checked ? 'dark' : 'light');
    });

    const estadoSelect = document.getElementById('estado');
    const cidadeSelect = document.getElementById('cidade');
    const citiesCache = new Map();

    estadoSelect.addEventListener('change', async () => {
      const uf = estadoSelect.value;
      cidadeSelect.disabled = true;
      cidadeSelect.innerHTML = '<option value="" selected disabled>Carregando cidades...</option>';

      try {
        let cidades = citiesCache.get(uf);

        if (!cidades) {
          const response = await fetch(
            `https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios?orderBy=nome`
          );
          if (!response.ok) throw new Error('Falha ao buscar municípios no IBGE.');
          const data = await response.json();
          cidades = data.map((item) => item.nome);
          citiesCache.set(uf, cidades);
        }

        cidadeSelect.innerHTML = '<option value="" selected disabled>Selecione a cidade</option>';
        for (const nomeCidade of cidades) {
          const option = document.createElement('option');
          option.value = nomeCidade;
          option.textContent = nomeCidade;
          cidadeSelect.appendChild(option);
        }
        cidadeSelect.disabled = false;
      } catch (err) {
        cidadeSelect.innerHTML =
          '<option value="" selected disabled>Erro ao carregar cidades. Tente novamente.</option>';
        showStatus('error', 'Não foi possível carregar as cidades do estado selecionado.');
      }
    });

    const COMMON_DOMAIN_TYPOS = {
      'gmial.com': 'gmail.com',
      'gamil.com': 'gmail.com',
      'gmai.com': 'gmail.com',
      'gmail.com.br': 'gmail.com',
      'hotnail.com': 'hotmail.com',
      'hotmai.com': 'hotmail.com',
      'outlok.com': 'outlook.com',
      'outloo.com': 'outlook.com',
      'yahooo.com': 'yahoo.com',
      'yaho.com': 'yahoo.com',
    };

    function validateEmailFormat(rawEmail) {
      const email = rawEmail.trim().toLowerCase();

      if (!email) {
        return { valid: false, message: 'Informe um endereço de e-mail.' };
      }

      if (email.length > 254 || /\s/.test(email)) {
        return { valid: false, message: 'O e-mail não pode conter espaços ou exceder 254 caracteres.' };
      }

      const parts = email.split('@');
      if (parts.length !== 2) {
        return { valid: false, message: 'Informe um e-mail válido no formato usuario@dominio.com.' };
      }

      const [localPart, domainPart] = parts;

      if (
        !localPart ||
        localPart.length > 64 ||
        localPart.startsWith('.') ||
        localPart.endsWith('.') ||
        localPart.includes('..') ||
        !/^[a-z0-9.!#$%&'*+/=?^_`{|}~-]+$/.test(localPart)
      ) {
        return { valid: false, message: 'A parte antes do "@" contém caracteres ou pontos inválidos.' };
      }

      if (
        !domainPart ||
        domainPart.startsWith('.') ||
        domainPart.endsWith('.') ||
        domainPart.includes('..')
      ) {
        return { valid: false, message: 'O domínio do e-mail parece inválido.' };
      }

      const domainLabels = domainPart.split('.');
      if (domainLabels.length < 2) {
        return { valid: false, message: 'O domínio precisa ter extensão (ex.: .com, .edu.br).' };
      }

      const labelRegex = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
      for (const label of domainLabels) {
        if (!labelRegex.test(label)) {
          return { valid: false, message: 'O domínio contém caracteres inválidos.' };
        }
      }

      const tld = domainLabels[domainLabels.length - 1];
      if (!/^[a-z]{2,24}$/.test(tld)) {
        return { valid: false, message: 'A extensão do domínio (ex.: .com, .br) é inválida.' };
      }

      if (COMMON_DOMAIN_TYPOS[domainPart]) {
        return {
          valid: false,
          message: `Você quis dizer "${localPart}@${COMMON_DOMAIN_TYPOS[domainPart]}"? Verifique o domínio.`,
        };
      }

      return { valid: true, email };
    }

    const form = document.getElementById('student-form');
    const statusBox = document.getElementById('student-status');

    function showStatus(type, message) {
      statusBox.className = `driver-status visible ${type}`;
      statusBox.textContent = message;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const estado = estadoSelect.value;
      const cidade = cidadeSelect.value;
      const instituicao = document.getElementById('instituicao').value.trim();
      const turno = document.getElementById('turno').value;
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      if (!nome || !estado || !cidade || !instituicao || !turno || !email || !senha) {
        showStatus('error', 'Preencha todos os campos para criar sua conta.');
        return;
      }

      const emailCheck = validateEmailFormat(email);
      if (!emailCheck.valid) {
        showStatus('error', emailCheck.message);
        return;
      }

      if (senha.length < 6) {
        showStatus('error', 'A senha deve ter pelo menos 6 caracteres.');
        return;
      }

      showStatus(
        'success',
        `Conta criada para ${nome} (${instituicao} • ${cidade}/${estado} • Turno ${turno})!`
      );
    });
  </script>
</body>
</html>
